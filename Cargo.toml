[package]
name = "omni-transaction"
version = "0.4.0"
authors = ["Proximity Labs Limited"]
license = "Apache-2.0"
edition = "2021"
repository = "https://github.com/near/omni-transaction-rs"
description = "Transaction builder for all chains in Rust"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[features]
default = ["all", "serde", "serde_json", "schemars"]
all = [
    "near",
    "bitcoin",
    "evm",
    "solana",
    "aptos",
    "sui",
    "zcash",
    "starknet",
    "ton",
]
bitcoin = ["sha2"]
evm = ["dep:rlp"]
near = ["dep:near-account-id", "dep:near-gas", "dep:near-token", "dep:bs58", "borsh"]
solana = ["dep:bs58"]
aptos = ["dep:sha3"]
sui = ["dep:blake2", "dep:bs58"]
zcash = ["bitcoin", "dep:blake2b_simd"]
starknet = ["dep:starknet-types-core", "dep:starknet-crypto", "dep:sha3"]
ton = ["sha2", "dep:base64"]
borsh = ["dep:borsh", "near-account-id/borsh", "near-gas/borsh", "near-token/borsh"]
serde = ["dep:serde", "dep:serde-big-array", "dep:base64", "near-account-id/serde", "near-gas/serde", "near-token/serde", "starknet-types-core?/serde"]
serde_json = ["dep:serde_json", "serde"]
schemars = ["dep:schemars", "near-account-id/schemars-v1", "near-gas/schemars-v1", "near-token/schemars-v1"]

[dependencies]
serde_json = { version = "1.0", optional = true }
rlp = { version = "0.6.1", optional = true }
hex = "0.4.3"
borsh = { version = "1.0.0", features = ["derive"], optional = true }
near-account-id = { version = "2", optional = true }
near-gas = { version = "0.3", optional = true }
near-token = { version = "0.3", optional = true }
serde-big-array = { version = "0.5.1", optional = true }
bs58 = { version = "0.5.1", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
schemars = { version = "1.0", optional = true }
sha2 = { version = "0.10.8", optional = true }
sha3 = { version = "0.10.8", optional = true }
blake2 = { version = "0.10.6", optional = true }
blake2b_simd = { version = "1.0", default-features = false, optional = true }
starknet-types-core = { version = "0.2.4", default-features = false, features = ["alloc"], optional = true }
starknet-crypto = { version = "0.8.1", default-features = false, features = ["alloc"], optional = true }
base64 = { version = "0.22", optional = true }


[dev-dependencies]
# ethereum
alloy = { version = "2.4", features = ["full", "node-bindings", "rlp"] }
alloy-rlp = { version = "0.3.8", features = ["derive"] }
alloy-primitives = { version = "1" }

# near
near-primitives = { version = "0.34" }
near-crypto = { version = "0.34" }
near-jsonrpc-client = { version = "0.20", features = ["any"] }
near-workspaces = { version = "0.22", features = ["experimental", "unstable"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.10.8" }
base64 = { version = "0.22" }

# bitcoin
bitcoin = { version = "0.32.0", default-features = false, features = [
    "std",
    "serde",
    "rand-std",
    "rand",
    "secp-lowmemory",
    "secp-recovery",
] }

# solana
solana-message = { version = "4.5.0", features = ["serde"] }
solana-transaction = { version = "4.3.0", features = ["serde"] }
solana-pubkey = { version = "4.3.0" }
solana-instruction = { version = "3.5.0" }
solana-hash = { version = "4.6.0" }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-keypair = { version = "3.1.2" }
solana-signer = { version = "3.0.1" }
solana-short-vec = { version = "3.3.0" }
bincode = { version = "1.3" }

# aptos / sui
bcs = { version = "0.1.6" }
ed25519-dalek = { version = "2" }
sui-sdk-types = { version = "=0.3.2", features = ["serde", "hash"] }

# starknet
starknet-core = { version = "0.16.0" }
starknet-crypto = { version = "0.8.1" }

# ton
tonlib-core = { version = "0.26" }
k256 = { version = "0.13.1", features = [
    "sha256",
    "ecdsa",
    "serde",
    "arithmetic",
    "expose-field",
] }

# async
tokio = { version = "1.38", features = ["full"] }

# misc
eyre = "0.6"

# testing
omni-testing-utilities = { git = "https://github.com/near/omni-testing-utilities", branch = "main" }
